services:
  - type: web
    name: 84x-seat-check
    runtime: node
    plan: free               # data lives in Postgres (DATABASE_URL), so no disk is needed
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: USER1_NAME
        sync: false
      - key: USER1_PASS
        sync: false
      - key: USER2_NAME
        sync: false
      - key: USER2_PASS
        sync: false
